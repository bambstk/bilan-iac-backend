name: DAST - OWASP ZAP

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: run locally
        run: |
          ./mvnw spring-boot:run &
          
          for i in $(seq 1 90); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && break
            sleep 1
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:8080'
          fail_action: false
          allow_issue_writing: false

      - name: ZAP Summary
        if: always()
        run: |
          {
            echo "## DAST — OWASP ZAP Baseline"
            echo ""
            if [ -f report_md.md ]; then
              echo "### Résumé"
              grep -E "^(FAIL|WARN)" report_md.md | head -n 20 || true
              echo ""
              echo "📎 Rapport complet dans les artifacts du run."
            else
              echo "Aucun rapport généré."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop backend
        if: always()
        run: pkill -f spring-boot || true